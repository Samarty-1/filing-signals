[project]
name = "filing-signals"
version = "0.1.0"
description = "SEC filings -> point-in-time text warehouse -> language models -> return tests"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "requests>=2.31",
    "tzdata>=2024.1",   # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "maturin>=1.7,<2", "pandas>=2.2"]
# Phase 3 model training (GPU): install with the CUDA build of torch first
ml = ["torch>=2.6", "transformers>=5", "peft>=0.15", "bitsandbytes>=0.45", "accelerate>=1.0",
      "datasets>=3", "sentence-transformers>=5", "scikit-learn>=1.5", "pandas>=2.2"]

[project.scripts]
filing-signals = "filing_signals.cli:main"

[build-system]
# maturin builds the Rust section parser (rust/) into filing_signals._parser
# and packages the pure-Python sources from src/ alongside it
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "filing_signals._parser"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
