[project]
name = "filing-signals"
version = "0.1.0"
description = "SEC filings -> point-in-time text warehouse -> language models -> return tests"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=15",
    "requests>=2.31",
    "tzdata>=2024.1",   # zoneinfo has no system tz database on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
filing-signals = "filing_signals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
filing_signals = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
