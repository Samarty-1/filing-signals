name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust unit checks
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      # maturin compiles rust/ into filing_signals._parser during the install
      - run: pip install -e ".[dev]"
      - name: Rust extension is importable
        run: python -c "from filing_signals import _parser; print('rust parser ok')"
      # Offline: the pipeline tests use a fake EDGAR, and every section-parsing
      # spec test runs against both the Python reference and the Rust parser.
      - run: pytest -q

  web:
    # Phase 5 explorer: strict type-check, unit tests, production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
